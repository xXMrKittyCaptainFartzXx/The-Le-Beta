<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVAL Playtest</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-wrapper {
            /* Single fluid calculation for width */
            width: min(95vw, calc((100vh - 50px) * (4 / 3)));
            
            /* Native 4:3 height resolution */
            aspect-ratio: 4 / 3;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        footer {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <iframe 
            src="/SERVAL_PixelArt_Game_Test-Build/index.html" 
            allow="autoplay; gamepad; fullscreen">
        </iframe>
    </div>

    <footer>
        <p><a href="guysandgal-lerie-s.html">← back to WORKS</a></p>
    </footer>

</body>
</html>
