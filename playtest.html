<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVAL Playtest</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Responsive container allowing fluid horizontal width */
        .game-wrapper {
            width: 100vw;
            height: calc(100vh - 40px);
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* iOS Safari Fullscreen Fallback */
        .game-wrapper.pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            z-index: 99999 !important;
            background-color: #000 !important;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        footer {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        footer a, footer button {
            color: #fff;
            background: none;
            border: none;
            text-decoration: none;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
        }

        footer button:hover, footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="game-container">
        <!-- Floating Exit Button for Mobile/Fullscreen Overlay -->
        <button id="overlay-exit-btn" onclick="toggleFullscreen()" style="display: none;">✕</button>
        
        <iframe 
            id="game-iframe"
            src="/SERVAL_PixelArt_Game_Test-Build/index.html" 
            allow="autoplay; gamepad; fullscreen">
        </iframe>
    </div>

    <footer>
        <button id="fullscreen-btn" onclick="toggleFullscreen()">[ Fullscreen ]</button>
        <span>|</span>
        <a href="guysandgal-lerie-s.html">← back to WORKS</a>
    </footer>

    <style>
        /* Base floating exit button (Hidden by default) */
        #overlay-exit-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #555;
            width: 36px;
            height: 36px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            line-height: 34px;
            padding: 0;
        }

        #overlay-exit-btn:active {
            background: #fff;
            color: #000;
        }

        /* Force hide on desktop devices with hover pointers */
        @media (hover: hover) and (pointer: fine) {
            #overlay-exit-btn {
                display: none !important;
            }
        }
    </style>

    <script>
        function updateFullscreenUI(isFullscreen) {
            const btn = document.getElementById('fullscreen-btn');
            const overlayBtn = document.getElementById('overlay-exit-btn');
            
            // Check if the user is on a touch device
            const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            
            if (isFullscreen) {
                btn.textContent = '[ Exit Fullscreen ]';
                // Only show overlay button on mobile touch devices
                if (isTouchDevice) {
                    overlayBtn.style.display = 'block';
                }
            } else {
                btn.textContent = '[ Fullscreen ]';
                overlayBtn.style.display = 'none';
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            const isNativeFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            const isPseudoFS = container.classList.contains('pseudo-fullscreen');

            if (!isNativeFS && !isPseudoFS) {
                // Enter Fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else {
                    // Fallback for iOS Safari
                    container.classList.add('pseudo-fullscreen');
                    updateFullscreenUI(true);
                }
            } else {
                // Exit Fullscreen
                if (isNativeFS) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                } else if (isPseudoFS) {
                    container.classList.remove('pseudo-fullscreen');
                    updateFullscreenUI(false);
                }
            }
        }

        // Listen for native escape/gesture exit events to keep UI in sync
        document.addEventListener('fullscreenchange', () => {
            updateFullscreenUI(!!document.fullscreenElement);
        });
        document.addEventListener('webkitfullscreenchange', () => {
            updateFullscreenUI(!!document.webkitFullscreenElement);
        });
    </script>

</body>
</html>
